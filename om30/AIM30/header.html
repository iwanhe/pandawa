        }

        function doHelpSec(list,page) {
                if (list.options[list.selectedIndex].value != '') {
                        var helpsecWin = window.open(page+'#'+list.options[list.selectedIndex].value,"help","resizable,menubar,scrollbars,left=10,top=10,height=350,width=500");
                        helpsecWin.focus();

        }
