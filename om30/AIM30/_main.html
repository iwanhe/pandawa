<SCRIPT LANGUAGE="javascript1.2">
	var blankPage = '<HTML><BODY bgcolor="#FFFFFF"></BODY></HTML>';

	// Check for compatible browser versions
	if (navigator.appName == "Netscape") {
		if (parseInt(navigator.appVersion) < 4) {
			alert("AIM 3.0 is designed to work with Nescape Navigator version 4.0 and later.  You are running Netscape version " + navigator.appVersion + ".  If you experience problems, upgrade to the latest version of Netscape.");
		}
	}
	else if (navigator.appName.indexOf("Internet Explorer") >= 0) {
		if (parseInt(navigator.appVersion) < 4) {
			alert("AIM 3.0 is designed to work with Internet Explorer version 4.0 and later.  You are running Internet Explorer version " + navigator.appVersion + ".  If you experience problems, upgrade to the latest version of Internet Explorer.");
		}
	}
	else {		// unrecognized browser
		alert("AIM 3.0 has been tested with Netscape Navigator version 4 and Internet Explorer versions 4 and 5.  You are running " + navigator.appName + " version " + navigator.appVersion + ", which has not been tested.  If you experience problems, you should install one of the supported browsers.");
	}

</SCRIPT>
